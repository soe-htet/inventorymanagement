
name: Inventory Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore InventoryManagement.slnx

      - name: Build
        run: dotnet build InventoryManagement.slnx --no-restore --configuration Release

      - name: Run tests
        env:
          Jwt__Key: "IntegrationTestOnlyKey_ChangeMe_12345678901234567890"
          Jwt__Issuer: "InventoryManagement"
          Jwt__Audience: "InventoryManagement"
        run: dotnet test InventoryManagement.slnx --no-build --configuration Release

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-api:latest
            ghcr.io/${{ github.repository_owner }}/inventory-api:${{ github.sha }}

  deploy:
    name: Deploy to Azure
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade

            az containerapp update \
              --name inventory-api-dev \
              --resource-group rg-inventory-dev \
              --image ghcr.io/${{ github.repository_owner }}/inventory-api:${{ github.sha }}
